<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>1PDF Viewer PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#eef1f5;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* TOPBAR */
.topbar {
  background:#222;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  border-radius:15px;
  margin-top:10px;
  width:95%;
  max-width:1200px;
}

.topbar button {
  margin:5px;
  padding:8px 12px;
  border:none;
  background:#4a90e2;
  color:white;
  border-radius:20px;
  cursor:pointer;
}

/* CONTROLLI */
#controls {
  margin:10px;
}

/* PDF */
#pdf-container {
  width:95%;
  max-width:1200px;
  height:85vh;
  background:white;
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* animazione */
.fade {
  animation: fadeIn 0.3s;
}
@keyframes fadeIn {
  from {opacity:0; transform:scale(0.98);}
  to {opacity:1; transform:scale(1);}
}

#pdf-page {
  position:relative;
}

canvas {
  max-width:100%;
  display:block;
}

/* LINK LAYER */
.linkLayer {
  position:absolute;
  top:0;
  left:0;
  z-index:1000;
}

.linkLayer a {
  position:absolute;
  cursor:pointer;
  transition: background 0.2s;
}

/* hover link */
.linkLayer a:hover {
  background:rgba(0, 150, 255, 0.2);
}
</style>
</head>

<body>

<!-- 🔵 TUOI PULSANTI -->
<div class="topbar">
  <button onclick="goToPage(1)">Inizio</button>
  <button onclick="goToPage(6)">Elisuperficie</button>
  <button onclick="goToPage(13)">Autostrada A1</button>
  <button onclick="goToPage(14)">Mappa Ospedali</button>
  <button onclick="goToPage(22)">Ospedali (Bo)</button>
  <button onclick="goToPage(30)">Ospedali Spc</button>
  <button onclick="goToPage(32)">Reparti H (Mo)</button>
  <button onclick="goToPage(45)">Reparti H (Bo)</button>
  <button onclick="goToPage(76)">Reparti S</button>
</div>

<!-- CONTROLLI -->
<div id="controls">
  <button onclick="prevPage()">⬅ Pagina</button>
  <button onclick="nextPage()">Pagina ➡</button>
  <span id="pageInfo"></span>
</div>

<!-- PDF -->
<div id="pdf-container">
  <div id="pdf-page"></div>
</div>

<script>
const url="https://sesaw-italia.github.io/pdf-viewer/documento.pdf";

let pdfDoc=null;
let currentPage=1;
let scale=1.5;

/* RENDER */
async function renderPage(num){
const page=await pdfDoc.getPage(num);

const container=document.getElementById("pdf-page");
container.innerHTML="";
container.classList.add("fade");

const canvas=document.createElement("canvas");
container.appendChild(canvas);

const ctx=canvas.getContext("2d");
const viewport=page.getViewport({scale});

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({canvasContext:ctx,viewport}).promise;

/* LINK */
const annotations=await page.getAnnotations();
const linkLayer=document.createElement("div");

linkLayer.className="linkLayer";
linkLayer.style.width=viewport.width+"px";
linkLayer.style.height=viewport.height+"px";

container.appendChild(linkLayer);

for(const ann of annotations){

if(ann.subtype!=="Link") continue;

const rect=pdfjsLib.Util.normalizeRect(ann.rect);
const [x1,y1,x2,y2]=viewport.convertToViewportRectangle(rect);

const link=document.createElement("a");

link.style.left=Math.min(x1,x2)+"px";
link.style.top=Math.min(y1,y2)+"px";
link.style.width=Math.abs(x2-x1)+"px";
link.style.height=Math.abs(y2-y1)+"px";

if(ann.url){
link.href=ann.url;
link.target="_blank";
}
else if(ann.dest){
link.href="#";
link.onclick=async(e)=>{
e.preventDefault();
let dest=ann.dest;

if(typeof dest==="string"){
dest=await pdfDoc.getDestination(dest);
}

if(Array.isArray(dest)){
const pageIndex=await pdfDoc.getPageIndex(dest[0]);
goToPage(pageIndex+1);
}
};
}

linkLayer.appendChild(link);
}

/* info pagina */
document.getElementById("pageInfo").innerText =
`Pagina ${currentPage} / ${pdfDoc.numPages}`;
}

/* NAVIGAZIONE */
function goToPage(p){
if(p>=1 && p<=pdfDoc.numPages){
currentPage=p;
renderPage(p);
}
}

function nextPage(){
if(currentPage<pdfDoc.numPages){
currentPage++;
renderPage(currentPage);
}
}

function prevPage(){
if(currentPage>1){
currentPage--;
renderPage(currentPage);
}
}

/* LOAD */
pdfjsLib.getDocument(url).promise.then(pdf=>{
pdfDoc=pdf;
renderPage(1);
});
</script>

</body>
</html>
