<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Viewer PDF</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f0f0f0;
    }

    .topbar {
      background: #222;
      padding: 10px;
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
    }

    .topbar button {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      background: #ffffff;
      cursor: pointer;
      border-radius: 20px;
    }

    #pdf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
    }

    canvas {
      max-width: 100%;
      height: auto;
      user-select: none;
    }
  </style>
</head>

<body>

<div class="topbar">
  <button onclick="goToPage(1)">Inizio</button>
  <button onclick="goToPage(6)">Elisuperficie</button>
  <button onclick="goToPage(13)">Autostrada A1</button>
  <button onclick="goToPage(14)">Mappa Ospedali (Mo)</button>
  <button onclick="goToPage(22)">Mappa Ospedali (Bo)</button>
  <button onclick="goToPage(30)">Ospedali Spc</button>
  <button onclick="goToPage(32)">Reparti H (Mo)</button>
  <button onclick="goToPage(45)">Reparti H (Bo)</button>
  <button onclick="goToPage(76)">Reparti S_(Mo)</button>
</div>

<div id="pdf-container">
  <canvas id="pdf"></canvas>
</div>

<script>
  const url = "https://sesaw-italia.github.io/pdf-viewer/documento.pdf";

  let pdfDoc = null;
  let currentPage = 1;

  // blocca click destro (solo deterrente)
  document.addEventListener("contextmenu", e => e.preventDefault());

  function renderPage(num) {
    pdfDoc.getPage(num).then(page => {
      const canvas = document.getElementById("pdf");
      const ctx = canvas.getContext("2d");

      const viewport = page.getViewport({ scale: 1.5 });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      page.render({
        canvasContext: ctx,
        viewport: viewport
      });
    });
  }

  function goToPage(page) {
    currentPage = page;
    renderPage(page);
  }

  // carica PDF
  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    renderPage(1);
  });
</script>

</body>
</html>
