<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Viewer PDF</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f0f0f0;
      text-align: center;
    }

    .topbar {
      background: #222;
      padding: 10px;
    }

    .topbar button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      background: #ffffff;
      cursor: pointer;
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
    }
  </style>
</head>

<body>

<div class="topbar">
  <button onclick="goToPage(1)">Inizio</button>
  <button onclick="goToPage(6)">Elisuperficie</button>
  <button onclick="goToPage(13)">Autostrada A1</button>
  <button onclick="goToPage(14)">Mappa Ospedali(Mo)</button>
  <button onclick="goToPage(22)">Mappa Ospedali(Bo)</button>
  <button onclick="goToPage(30)">Ospedali Spc</button>
  <button onclick="goToPage(32)">Reparti H(Mo)</button>
  <button onclick="goToPage(45)">Reparti H(Bo)</button>
  <button onclick="goToPage(76)">Reparti S(Mo)</button>
</div>

//<iframe id="pdfViewer"></iframe>
<iframe 
  src="pdfjs/web/viewer.html?file=documento.pdf#toolbar=0" 
  width="100%" 
  height="100%">
</iframe>

<script>
  const pdfUrl = "https://raw.githubusercontent.com/Sesaw-italia/pdf-viewer/main/documento.pdf";

  function goToPage(page) {
    document.getElementById("pdfViewer").src =
      "https://mozilla.github.io/pdf.js/web/viewer.html?file=" 
      + pdfUrl + "#page=" + page + "&zoom=page-width&toolbar=0";
  }

  // carica pagina iniziale
  goToPage(1);
</script>

</body>
</html>
