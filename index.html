<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Viewer PDF</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f0f0f0;
    }

    .topbar {
      background: #222;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .topbar button, .topbar input {
      padding: 6px 10px;
      border: none;
      border-radius: 20px;
    }

    .topbar button {
      background: #ffffff;
      cursor: pointer;
    }

    .section {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    #pdf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
    }

    canvas {
      max-width: 100%;
      user-select: none;
    }
  </style>
</head>

<body>

<div class="topbar">

  <!-- 🔵 I TUOI PULSANTI -->
  <div class="section">
    <button onclick="goToPage(1)">Inizio</button>
    <button onclick="goToPage(6)">Elisuperficie</button>
    <button onclick="goToPage(13)">Autostrada A1</button>
    <button onclick="goToPage(14)">Mappa Ospedali (Mo)</button>
    <button onclick="goToPage(22)">Mappa Ospedali (Bo)</button>
    <button onclick="goToPage(30)">Ospedali Spc</button>
    <button onclick="goToPage(32)">Reparti H (Mo)</button>
    <button onclick="goToPage(45)">Reparti H (Bo)</button>
    <button onclick="goToPage(76)">Reparti S_(Mo)</button>
  </div>

  <!-- 📄 MENU PAGINA -->
  <div class="section">
    <input type="number" id="pageInput" placeholder="Pagina">
    <button onclick="goToInputPage()">Vai</button>
  </div>

  <!-- 🔍 CERCA -->
  <div class="section">
    <input type="text" id="searchText" placeholder="Cerca...">
    <button onclick="searchText()">Cerca</button>
  </div>

  <!-- ⚙️ OPZIONI -->
  <div class="section">
    <button onclick="zoomIn()">Zoom +</button>
    <button onclick="zoomOut()">Zoom -</button>
    <button onclick="toggleTheme()">Tema</button>
  </div>

</div>

<div id="pdf-container">
  <canvas id="pdf"></canvas>
</div>

<script>
  const url = "https://sesaw-italia.github.io/pdf-viewer/documento.pdf";

  let pdfDoc = null;
  let currentPage = 1;
  let scale = 1.5;

  document.addEventListener("contextmenu", e => e.preventDefault());

  function renderPage(num) {
    pdfDoc.getPage(num).then(page => {
      const canvas = document.getElementById("pdf");
      const ctx = canvas.getContext("2d");

      const viewport = page.getViewport({ scale: scale });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      page.render({
        canvasContext: ctx,
        viewport: viewport
      });
    });
  }

  function goToPage(page) {
    if (!pdfDoc) return;
    if (page < 1 || page > pdfDoc.numPages) return;
    currentPage = page;
    renderPage(page);
  }

  function goToInputPage() {
    const page = parseInt(document.getElementById("pageInput").value);
    goToPage(page);
  }

  // 🔍 CERCA TESTO
  async function searchText() {
    const text = document.getElementById("searchText").value.toLowerCase();

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const content = await page.getTextContent();

      const strings = content.items.map(item => item.str.toLowerCase());

      if (strings.join(" ").includes(text)) {
        goToPage(i);
        alert("Trovato a pagina " + i);
        return;
      }
    }

    alert("Testo non trovato");
  }

  // 🔎 ZOOM
  function zoomIn() {
    scale += 0.3;
    renderPage(currentPage);
  }

  function zoomOut() {
    scale -= 0.3;
    if (scale < 0.5) scale = 0.5;
    renderPage(currentPage);
  }

  // 🎨 TEMA
  function toggleTheme() {
    const body = document.body;
    if (body.style.background === "black") {
      body.style.background = "#f0f0f0";
    } else {
      body.style.background = "black";
    }
  }

  // LOAD PDF
  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    renderPage(1);
  });
</script>

</body>
</html>
