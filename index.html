<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Viewer PDF</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef1f5;
    }

    /* 🔵 BARRA PRINCIPALE */
    .topbar {
      background: #1e1e2f;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 🔹 RIGA */
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* 🔵 TUOI PULSANTI */
    .primary button {
      background: #4a90e2;
      color: white;
      font-weight: bold;
    }

    /* ⚙️ CONTROLLI */
    .secondary button {
      background: #ffffff;
    }

    button, input {
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    input {
      outline: none;
    }

    /* 📄 PDF */
    #pdf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
    }

    canvas {
      max-width: 100%;
      user-select: none;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    /* ⚙️ MENU */
    .menu {
      position: absolute;
      top: 90px;
      right: 20px;
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      gap: 5px;
    }

    .menu button {
      width: 100%;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="topbar">

  <!-- 🔵 RIGA 1: I TUOI -->
  <div class="row primary">
    <button onclick="goToPage(1)">Inizio</button>
    <button onclick="goToPage(6)">Elisuperficie</button>
    <button onclick="goToPage(13)">Autostrada A1</button>
    <button onclick="goToPage(14)">Mappa Ospedali (Mo)</button>
    <button onclick="goToPage(22)">Mappa Ospedali (Bo)</button>
    <button onclick="goToPage(30)">Ospedali Spc</button>
    <button onclick="goToPage(32)">Reparti H (Mo)</button>
    <button onclick="goToPage(45)">Reparti H (Bo)</button>
    <button onclick="goToPage(76)">Reparti S (Mo)</button>
  </div>

  <!-- ⚙️ RIGA 2: CONTROLLI -->
  <div class="row secondary">

    <!-- PAGINA -->
    <input type="number" id="pageInput" placeholder="Pagina">
    <button onclick="goToInputPage()">Vai</button>

    <!-- CERCA -->
    <input type="text" id="searchText" placeholder="Cerca...">
    <button onclick="searchText()">Cerca</button>

    <!-- ZOOM -->
    <button onclick="zoomIn()">＋</button>
    <button onclick="zoomOut()">－</button>

    <!-- MENU -->
    <button onclick="toggleMenu()">⚙️ Opzioni</button>

  </div>

</div>

<!-- MENU OPZIONI -->
<div id="menu" class="menu">
  <button onclick="rotate(90)">Ruota ➡️</button>
  <button onclick="rotate(-90)">Ruota ⬅️</button>
  <button onclick="resetView()">Reset vista</button>
</div>

<div id="pdf-container">
  <canvas id="pdf"></canvas>
</div>

<script>
  const url = "https://sesaw-italia.github.io/pdf-viewer/documento.pdf";

  let pdfDoc = null;
  let currentPage = 1;
  let scale = 1.5;
  let rotation = 0;

  document.addEventListener("contextmenu", e => e.preventDefault());

  function renderPage(num) {
    pdfDoc.getPage(num).then(page => {
      const canvas = document.getElementById("pdf");
      const ctx = canvas.getContext("2d");

      const viewport = page.getViewport({
        scale: scale,
        rotation: rotation
      });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      page.render({
        canvasContext: ctx,
        viewport: viewport
      });
    });
  }

  function goToPage(page) {
    if (!pdfDoc) return;
    if (page < 1 || page > pdfDoc.numPages) return;
    currentPage = page;
    renderPage(page);
  }

  function goToInputPage() {
    const page = parseInt(document.getElementById("pageInput").value);
    goToPage(page);
  }

  // 🔍 CERCA
  async function searchText() {
    const text = document.getElementById("searchText").value.toLowerCase();

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const content = await page.getTextContent();

      const strings = content.items.map(item => item.str.toLowerCase());

      if (strings.join(" ").includes(text)) {
        goToPage(i);
        alert("Trovato a pagina " + i);
        return;
      }
    }

    alert("Non trovato");
  }

  // 🔎 ZOOM
  function zoomIn() {
    scale += 0.3;
    renderPage(currentPage);
  }

  function zoomOut() {
    scale -= 0.3;
    if (scale < 0.5) scale = 0.5;
    renderPage(currentPage);
  }

  // 🔄 ROTAZIONE
  function rotate(deg) {
    rotation += deg;
    renderPage(currentPage);
  }

  function resetView() {
    scale = 1.5;
    rotation = 0;
    renderPage(currentPage);
  }

  // ⚙️ MENU
  function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
  }

  // LOAD PDF
  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    renderPage(1);
  });
</script>

</body>
</html>
